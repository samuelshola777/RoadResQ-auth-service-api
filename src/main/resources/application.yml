server:
  port: ${PORT:8081}
  tomcat:
    max-swallow-size: 6MB
  error:
    include-message: never
    include-stacktrace: never

spring:
  config:
    import: "file:./env.properties"

  application:
    name: road-resq-auth

  mongodb:
    uri: ${MONGODB_URI}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      connect-timeout: 500ms
      timeout: 500ms
    mongodb:
      auto-index-creation: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  membership-cache:
    enabled: ${MEMBERSHIP_CACHE_ENABLED:false}
    ttl-seconds: ${MEMBERSHIP_CACHE_TTL_SECONDS:30}
  jwt-secret: ${JWT_SECRET}
  secret-key: ${SECRET_KEY}
  encryption-secret-key: ${ENCRYPTION_SECRET_KEY}
  api-key: ${API_KEY}
  internal-key: ${INTERNAL_SERVICE_KEY}
  cloudinary-cloud: ${CLOUDINARY_CLOUD_NAME}
  cloudinary-key: ${CLOUDINARY_API_KEY}
  cloudinary-secret: ${CLOUDINARY_API_SECRET}


  issuer: ${JWT_ISSUER:road-resq-auth}
  audience: ${JWT_AUDIENCE:road-resq}

  google-client-ids: ${GOOGLE_CLIENT_IDS:}

  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

  upload-dir: ${UPLOAD_DIR:./uploads}
  mail-from: ${MAIL_FROM:noreply@roadresq.example}

  seed:
    enabled: ${SEED_SUPER_ADMIN:false}
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}